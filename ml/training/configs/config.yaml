# AI Training Configuration
# OpenAI/Gemini-style LLM Training Setup

project:
  name: "digital-ai-llm"
  version: "1.0.0"
  description: "OpenAI/Gemini-style AI model training"

model:
  type: "transformer"
  architecture: "gpt-like"
  vocab_size: 50000
  max_sequence_length: 2048
  embedding_dim: 768
  num_heads: 12
  num_layers: 12
  dropout: 0.1
  
training:
  batch_size: 32
  learning_rate: 0.0001
  epochs: 10
  warmup_steps: 1000
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  weight_decay: 0.01
  save_steps: 2
  eval_steps: 2
  
data:
  train_path: "ml/data/datasets/train.jsonl"
  validation_path: "ml/data/datasets/val.jsonl"
  test_path: "ml/data/datasets/test.jsonl"
  preprocessing:
    lowercase: true
    remove_special_chars: false
    max_length: 2048
    
hardware:
  device: "cuda"  # or "cpu"
  num_workers: 4
  mixed_precision: true
  
logging:
  log_dir: "ml/experiments/logs"
  tensorboard: true
  wandb: false
  log_interval: 10
  
paths:
  checkpoint_dir: "ml/checkpoints"
  model_dir: "ml/model_registry"
  data_dir: "ml/data/datasets"
