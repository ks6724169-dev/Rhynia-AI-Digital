<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="headGrad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Head Silhouette -->
  <path d="M 42 160 
           C 34 148 26 130 28 104 
           C 30 68 52 32 96 30 
           C 136 28 154 58 154 90 
           C 154 108 147 122 150 130 
           C 152 135 161 139 163 146 
           C 165 152 154 157 156 163 
           C 158 168 167 175 163 182 
           C 158 188 147 186 143 194 
           C 138 206 143 226 144 230 
           C 126 228 108 220 94 208 
           C 78 194 74 175 42 160 Z" 
        transform="scale(0.72) translate(15, 12)"
        fill="url(#headGrad)" 
        style="filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.85));" />

  <!-- Brain Dark Cavity -->
  <path d="M 44 125 
           C 40 90 58 55 94 52 
           C 126 50 140 74 140 102 
           C 140 124 126 142 108 150 
           C 86 159 48 150 44 125 Z" 
        transform="scale(0.72) translate(15, 12)"
        fill="#070a18" 
        stroke="url(#headGrad)" 
        stroke-width="2.5" />

  <!-- Neural Network Synapses -->
  <g transform="scale(0.72) translate(15, 12)" stroke="#38bdf8" stroke-width="2.2" opacity="0.95">
    <line x1="64" y1="120" x2="76" y2="88" />
    <line x1="76" y1="88" x2="98" y2="70" />
    <line x1="98" y1="70" x2="124" y2="84" />
    <line x1="124" y1="84" x2="112" y2="116" />
    <line x1="112" y1="116" x2="82" y2="134" />
    <line x1="82" y1="134" x2="64" y2="120" />
    <line x1="76" y1="88" x2="112" y2="116" />
    <line x1="98" y1="70" x2="92" y2="106" />
    <line x1="92" y1="106" x2="82" y2="134" stroke="#f43f5e" />
    <line x1="64" y1="120" x2="92" y2="106" />
    <line x1="124" y1="84" x2="130" y2="124" />
    <line x1="112" y1="116" x2="130" y2="124" stroke="#ec4899" />

    <!-- Pink Nodes -->
    <circle cx="64" cy="120" r="5.5" fill="#f43f5e" style="filter: drop-shadow(0 0 6px #f43f5e);" />
    <circle cx="92" cy="106" r="6.8" fill="#ec4899" style="filter: drop-shadow(0 0 7px #ec4899);" />
    <circle cx="82" cy="134" r="5.5" fill="#f43f5e" style="filter: drop-shadow(0 0 6px #f43f5e);" />
    <circle cx="98" cy="70" r="6.8" fill="#ec4899" style="filter: drop-shadow(0 0 7px #ec4899);" />

    <!-- Cyan Nodes -->
    <circle cx="76" cy="88" r="5.5" fill="#38bdf8" style="filter: drop-shadow(0 0 6px #38bdf8);" />
    <circle cx="124" cy="84" r="6.5" fill="#00f0ff" style="filter: drop-shadow(0 0 8px #00f0ff);" />
    <circle cx="112" cy="116" r="6" fill="#38bdf8" style="filter: drop-shadow(0 0 6px #38bdf8);" />
    <circle cx="130" cy="124" r="5" fill="#00f0ff" style="filter: drop-shadow(0 0 6px #00f0ff);" />
  </g>

  <!-- Thought Cloud Bubble (Upper Right) -->
  <g transform="translate(136, 16)">
    <circle cx="6" cy="56" r="3.5" fill="#38bdf8" />
    <circle cx="15" cy="44" r="5" fill="#38bdf8" />
    <path d="M 26 34 
             C 18 34 14 26 18 18 
             C 20 10 30 8 38 12 
             C 44 4 58 4 64 12 
             C 72 8 82 14 82 24 
             C 88 28 86 40 78 44 
             C 74 48 62 50 54 45 
             C 46 50 32 46 26 34 Z" 
          fill="#0b1226" 
          stroke="url(#cloudGrad)" 
          stroke-width="2.5" 
          style="filter: drop-shadow(0 0 6px #38bdf8);" />
    <circle cx="38" cy="27" r="3" fill="#ffffff" />
    <circle cx="51" cy="27" r="3" fill="#ffffff" />
    <circle cx="64" cy="27" r="3" fill="#ffffff" />
  </g>
</svg>