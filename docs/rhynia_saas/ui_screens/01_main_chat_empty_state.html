<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rhynia - Main Chat</title>
<!-- Typography: Segoe UI with fallback Plus Jakarta Sans & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with Container Queries and Forms -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#0078d4",
          "primary-hover": "#1084d8",
          "primary-pressed": "#006cbe",
          "surface": "#181818",
          "surface-card": "#202020",
          "surface-flyout": "#2b2b2b",
          "surface-highlight": "#323232",
          "stroke-subtle": "rgba(255, 255, 255, 0.08)",
          "stroke-strong": "rgba(255, 255, 255, 0.14)",
          "text-primary": "#f3f3f3",
          "text-secondary": "#adadad",
          "text-disabled": "#6f6f6f"
        },
        fontFamily: {
          sans: ['"Segoe UI"', '"Plus Jakarta Sans"', 'Inter', '-apple-system', 'sans-serif'],
          headline: ['"Segoe UI"', '"Plus Jakarta Sans"', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
    /* Material Symbols base styling */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }

    /* Fluent Design Mica dark background */
    body {
      min-height: max(884px, 100dvh);
      background-color: #181818;
      background-image: radial-gradient(circle 600px at 50% 0%, rgba(0, 120, 212, 0.05), transparent 80%);
      font-family: "Segoe UI", "Plus Jakarta Sans", Inter, -apple-system, sans-serif;
    }

    /* Fluent 2 Acrylic / Mica elevation pill */
    .fluent-composer-pill {
      background: rgba(32, 32, 32, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    }

    .fluent-composer-pill:focus-within {
      border-color: rgba(0, 120, 212, 0.65);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 120, 212, 0.35);
    }

    /* Fluent Flyout Menu */
    .fluent-flyout {
      background: rgba(43, 43, 43, 0.94);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.65), 0 4px 12px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="text-text-primary antialiased min-h-screen flex flex-col justify-between overflow-x-hidden relative selection:bg-primary selection:text-white">
<!-- Top Bar: Strictly minimalist hamburger menu per wireframe -->
<header class="relative z-40 w-full max-w-screen-md mx-auto px-4 pt-4 pb-2 flex items-center justify-between">
<!-- 44px touch target [ ≡ ] button -->
<button aria-label="Open Navigation Drawer" class="w-11 h-11 flex items-center justify-center rounded-lg text-text-primary hover:bg-surface-highlight active:bg-white/[0.04] transition-all duration-150 focus:outline-none" id="menuToggle">
<span class="material-symbols-outlined text-[24px]" data-icon="menu">menu</span>
</button>
</header>
<!-- Navigation Drawer (Fluent 2 Surface styling) -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 transition-opacity duration-300 opacity-0 pointer-events-none" id="drawerOverlay"></div>
<aside class="fixed inset-y-0 left-0 z-50 flex flex-col justify-between p-5 w-80 max-w-[85vw] bg-surface-card border-r border-stroke-subtle shadow-2xl transition-transform duration-300 -translate-x-full" id="navDrawer">
<!-- Drawer Header / Profile -->
<div class="flex flex-col gap-6">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-highlight border border-stroke-subtle flex items-center justify-center text-primary font-semibold">
<span class="material-symbols-outlined text-primary text-[22px]" data-icon="person">person</span>
</div>
<div>
<h2 class="text-[17px] font-semibold text-text-primary leading-tight font-headline">Rhynia</h2>
<div class="flex items-center gap-2">
<span class="text-[12px] text-text-secondary">alex_rhynia</span>
<span class="inline-block w-1 h-1 rounded-full bg-text-disabled"></span>
<span class="text-[12px] text-primary font-medium">Free Tier</span>
</div>
</div>
</div>
<button class="w-8 h-8 rounded-md flex items-center justify-center text-text-secondary hover:text-text-primary hover:bg-surface-highlight transition-colors" id="closeDrawer">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<!-- Drawer History Tabs -->
<div class="flex flex-col gap-1 pt-2">
<div class="text-[11px] text-text-disabled font-semibold px-3 mb-1 tracking-wider uppercase">History</div>
<!-- Tab 1: Today (Active) -->
<a class="flex items-center gap-3 bg-surface-highlight text-primary font-medium rounded-lg px-3.5 py-2.5 transition-colors relative before:absolute before:left-1 before:top-2 before:bottom-2 before:w-1 before:bg-primary before:rounded-full" href="#">
<span class="material-symbols-outlined text-[20px] text-primary" data-icon="schedule">schedule</span>
<span class="text-[14px]">Today</span>
</a>
<!-- Tab 2: Yesterday -->
<a class="flex items-center gap-3 text-text-secondary hover:text-text-primary hover:bg-surface-highlight/70 transition-colors px-3.5 py-2.5 rounded-lg" href="#">
<span class="material-symbols-outlined text-[20px]" data-icon="history">history</span>
<span class="text-[14px]">Yesterday</span>
</a>
<!-- Tab 3: Previous 7 Days -->
<a class="flex items-center gap-3 text-text-secondary hover:text-text-primary hover:bg-surface-highlight/70 transition-colors px-3.5 py-2.5 rounded-lg" href="#">
<span class="material-symbols-outlined text-[20px]" data-icon="date_range">date_range</span>
<span class="text-[14px]">Previous 7 Days</span>
</a>
</div>
</div>
<!-- Drawer Footer Actions -->
<div class="pt-4 border-t border-stroke-subtle flex flex-col gap-1">
<a class="flex items-center gap-3 px-3.5 py-2 rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface-highlight/70 transition-colors" href="#">
<span class="material-symbols-outlined text-[20px]" data-icon="settings">settings</span>
<span class="text-[13px] font-medium">Settings</span>
</a>
<a class="flex items-center gap-3 px-3.5 py-2 rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface-highlight/70 transition-colors" href="#">
<span class="material-symbols-outlined text-[20px]" data-icon="help">help</span>
<span class="text-[13px] font-medium">Updates &amp; FAQ</span>
</a>
</div>
</aside>
<!-- Center Area: Completely clean and empty space -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 max-w-screen-md mx-auto w-full text-center select-none py-12"></main>
<!-- Input Bar Docked at Bottom with Microsoft Fluent Design 2 Styling -->
<footer class="fixed bottom-0 inset-x-0 z-30 w-full max-w-screen-md mx-auto px-4 pb-6 pt-2">
<!-- Attachment Flyout Menu (Fluent 2 Context Menu) -->
<div class="hidden absolute bottom-24 left-4 z-40 w-60 fluent-flyout rounded-xl p-1.5 transition-all transform origin-bottom-left" id="attachmentMenu">
<div class="flex flex-col gap-0.5">
<!-- Option 1: Camera Capture -->
<button class="flex items-center gap-3 w-full px-3 py-2 rounded-lg text-left text-text-primary hover:bg-surface-highlight transition-colors active:scale-[0.98]" id="btnCameraCapture">
<div class="w-7 h-7 rounded-md bg-surface-card border border-stroke-subtle flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[18px]" data-icon="photo_camera">photo_camera</span>
</div>
<span class="text-[13px] font-medium tracking-tight">Camera Capture</span>
</button>
<!-- Option 2: Device File Manager -->
<button class="flex items-center gap-3 w-full px-3 py-2 rounded-lg text-left text-text-primary hover:bg-surface-highlight transition-colors active:scale-[0.98]" id="btnFileManager">
<div class="w-7 h-7 rounded-md bg-surface-card border border-stroke-subtle flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[18px]" data-icon="folder_open">folder_open</span>
</div>
<span class="text-[13px] font-medium tracking-tight">Device File Manager</span>
</button>
</div>
</div>
<!-- Hidden native file input for actual handling -->
<input class="hidden" id="fileInput" multiple="" type="file"/>
<input accept="image/*" capture="environment" class="hidden" id="cameraInput" type="file"/>
<!-- Docked Floating Composer Pill Container -->
<div class="fluent-composer-pill rounded-full px-2 py-1.5 flex items-center gap-2 transition-all duration-200">
<!-- (+) Button for attachments -->
<button aria-expanded="false" aria-label="Attach Media or File" class="w-10 h-10 rounded-full flex items-center justify-center text-text-secondary hover:text-text-primary hover:bg-white/[0.06] active:scale-95 transition-all duration-150 flex-shrink-0" id="plusToggle" type="button">
<span class="material-symbols-outlined text-[22px] transition-transform duration-200" data-icon="add" id="plusIcon">add</span>
</button>
<!-- Input Text Field -->
<input autocomplete="off" class="flex-1 bg-transparent border-none text-text-primary placeholder:text-text-disabled text-[15px] focus:ring-0 focus:outline-none px-2 py-2" id="chatInput" placeholder="Ask Rhynia…" type="text"/>
<!-- Voice Input Button (Fluent micro-interaction) -->
<button aria-label="Voice Input" class="w-10 h-10 rounded-full flex items-center justify-center text-text-secondary hover:text-text-primary hover:bg-white/[0.06] active:scale-95 transition-all duration-150 flex-shrink-0" id="micBtn" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="mic">mic</span>
</button>
<!-- Send Action Button: Fluent Azure Blue (#0078D4) with elevation & press effect -->
<button aria-label="Send message" class="w-10 h-10 rounded-full bg-[#0078D4] hover:bg-[#1084D8] active:bg-[#006CBE] text-white flex items-center justify-center active:scale-95 transition-all duration-150 flex-shrink-0 shadow-md shadow-blue-900/30" id="sendBtn" type="button">
<span class="material-symbols-outlined text-[20px] transform -rotate-45 ml-0.5" data-icon="near_me">near_me</span>
</button>
</div>
<!-- Active Attachment Tag Container (Dynamically populates) -->
<div class="hidden items-center gap-2 mt-2 px-3 text-[12px] font-medium text-primary" id="attachmentIndicator">
<span class="material-symbols-outlined text-[16px]" data-icon="attachment">attachment</span>
<span id="attachmentFileName">File attached</span>
<button class="ml-1 text-text-secondary hover:text-red-400" id="clearAttachment">
<span class="material-symbols-outlined text-[14px]" data-icon="close">close</span>
</button>
</div>
</footer>
<!-- Vanilla JS Interactions -->
<script>
    // Navigation Drawer Logic
    const menuToggle = document.getElementById('menuToggle');
    const closeDrawer = document.getElementById('closeDrawer');
    const navDrawer = document.getElementById('navDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');

    function openNav() {
      navDrawer.classList.remove('-translate-x-full');
      drawerOverlay.classList.remove('opacity-0', 'pointer-events-none');
      drawerOverlay.classList.add('opacity-100');
    }

    function closeNav() {
      navDrawer.classList.add('-translate-x-full');
      drawerOverlay.classList.remove('opacity-100');
      drawerOverlay.classList.add('opacity-0', 'pointer-events-none');
    }

    menuToggle.addEventListener('click', openNav);
    closeDrawer.addEventListener('click', closeNav);
    drawerOverlay.addEventListener('click', closeNav);

    // (+) Attachment Popover Logic
    const plusToggle = document.getElementById('plusToggle');
    const plusIcon = document.getElementById('plusIcon');
    const attachmentMenu = document.getElementById('attachmentMenu');
    const btnCameraCapture = document.getElementById('btnCameraCapture');
    const btnFileManager = document.getElementById('btnFileManager');
    const fileInput = document.getElementById('fileInput');
    const cameraInput = document.getElementById('cameraInput');
    const attachmentIndicator = document.getElementById('attachmentIndicator');
    const attachmentFileName = document.getElementById('attachmentFileName');
    const clearAttachment = document.getElementById('clearAttachment');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    let menuOpen = false;

    function toggleAttachmentMenu(e) {
      if (e) e.stopPropagation();
      menuOpen = !menuOpen;
      if (menuOpen) {
        attachmentMenu.classList.remove('hidden');
        plusIcon.style.transform = 'rotate(45deg)';
        plusToggle.setAttribute('aria-expanded', 'true');
      } else {
        attachmentMenu.classList.add('hidden');
        plusIcon.style.transform = 'rotate(0deg)';
        plusToggle.setAttribute('aria-expanded', 'false');
      }
    }

    plusToggle.addEventListener('click', toggleAttachmentMenu);

    document.addEventListener('click', (e) => {
      if (menuOpen && !attachmentMenu.contains(e.target) && !plusToggle.contains(e.target)) {
        toggleAttachmentMenu();
      }
    });

    btnCameraCapture.addEventListener('click', () => {
      cameraInput.click();
      toggleAttachmentMenu();
    });

    btnFileManager.addEventListener('click', () => {
      fileInput.click();
      toggleAttachmentMenu();
    });

    function handleFileSelection(event) {
      const files = event.target.files;
      if (files && files.length > 0) {
        attachmentFileName.textContent = files[0].name;
        attachmentIndicator.classList.remove('hidden');
        attachmentIndicator.classList.add('flex');
      }
    }

    fileInput.addEventListener('change', handleFileSelection);
    cameraInput.addEventListener('change', handleFileSelection);

    clearAttachment.addEventListener('click', () => {
      fileInput.value = '';
      cameraInput.value = '';
      attachmentIndicator.classList.add('hidden');
      attachmentIndicator.classList.remove('flex');
    });

    // Composer submission interaction
    sendBtn.addEventListener('click', () => {
      if (chatInput.value.trim() !== '') {
        chatInput.value = '';
        clearAttachment.click();
      }
    });

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });
  </script>
</body></html>
